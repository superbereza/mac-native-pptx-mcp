[project]
name = "powerpoint-by-anthropic-mac-sidecar"
version = "0.7.0"
description = "Sidecar MCP server that fixes broken AppleScript handles in Anthropic's PowerPoint connector on macOS, plus extra tools (thumbnails, placeholder addressing, move, layout swap)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Danila Berezin" },
]
keywords = ["mcp", "powerpoint", "applescript", "macos", "anthropic", "claude"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0",
]

[project.scripts]
pptx-sidecar = "pptx_sidecar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_sidecar"]
