[project]
name = "mac-native-pptx-mcp"
version = "0.8.0"
description = "Full-featured PowerPoint MCP server for macOS that drives the live Microsoft PowerPoint app via AppleScript (not OOXML editing). 21 tools covering lifecycle, slide editing, shape editing, and inline visual feedback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Danila Berezin" },
]
keywords = ["mcp", "powerpoint", "applescript", "macos", "anthropic", "claude"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0",
]

[project.scripts]
pptx-mcp = "pptx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_mcp"]
